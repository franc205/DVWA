name: "IaC: Checkov"
on: [pull_request]

jobs:
  checkov-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov GitHub Action
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ./infrastructure # Carpeta donde están tus Terraform/K8s
          framework: all 
          soft_fail: false # Falla el pipeline
